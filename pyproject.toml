[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provenant"
version = "0.1.0"
description = "Executable requirements with change-impact tracing for hardware test data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
keywords = ["requirements", "traceability", "verification", "test data", "ReqIF", "systems engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff>=0.4", "mypy>=1.8", "types-PyYAML"]

[project.scripts]
provenant = "provenant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Inline CSS/HTML templates, aligned constructor calls, and a verbatim third-party ReqIF fixture.
"src/provenant/report.py" = ["E501"]
"src/provenant/lock.py" = ["E501"]
"tests/test_reqif.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/provenant"]
